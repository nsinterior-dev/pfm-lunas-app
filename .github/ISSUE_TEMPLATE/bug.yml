name: Bug Report
description: Something that used to work is now broken, or behavior doesn't match documented acceptance criteria.
labels: ["bugfix"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. What did you see?
      placeholder: "When I click X, Y happens instead of Z..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error...
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Suspected scope
      description: How big do you think this is? (The planner agent will refine this.)
      options:
        - XS (1 file, < 20 lines)
        - S (1-3 files, single layer)
        - M (3-10 files, crosses layers)
        - L (10+ files or 3+ features)
        - Unknown
      default: 4
    validations:
      required: true
  - type: input
    id: lun-ticket
    attributes:
      label: Related LUN ticket
      description: If this relates to a sprint ticket, enter it here.
      placeholder: "LUN-011"
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain.
    validations:
      required: false
