name: Improvement
description: Existing functionality that should work differently or better.
labels: ["improvement"]
body:
  - type: textarea
    id: today
    attributes:
      label: What exists today?
      description: Describe the current behavior or state.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change?
      description: Describe the desired improvement.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What's the reason or evidence for this change?
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Suspected scope
      description: How big do you think this is? (The planner agent will refine this.)
      options:
        - XS (1 file, < 20 lines)
        - S (1-3 files, single layer)
        - M (3-10 files, crosses layers)
        - L (10+ files or 3+ features)
        - Unknown
      default: 4
    validations:
      required: true
  - type: input
    id: lun-ticket
    attributes:
      label: Related LUN ticket
      description: If this relates to a sprint ticket, enter it here.
      placeholder: "LUN-011"
    validations:
      required: false
