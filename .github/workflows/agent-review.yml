name: Agent Code Review

# Triggers on PR open and push-to-PR against development or main.
# Uses Gemini API (free tier) for code review, posts findings as PR comments.
#
# WHY THIS APPROACH:
# Originally used anthropics/claude-code-action@v1, but that requires a paid
# Anthropic API key. Switched to Gemini API (free tier: 15 RPM, 1M TPM) to
# avoid CI costs. The trade-off: we lose the action's built-in PR context
# injection and must handle diff extraction + comment posting ourselves.
# The review quality is good for catching structural/convention violations.
#
# ALTERNATIVE CONSIDERED:
# CodeRabbit (free GitHub App for public repos) — zero config but less
# customizable. We chose Gemini to keep the review checklist aligned with
# .claude/skills/code-review/SKILL.md and maintain full control.

on:
  pull_request:
    types: [opened, synchronize]
    branches: [development, main]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          DIFF=$(git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.yml' '*.yaml' '*.md' | head -c 900000)
          echo "has_diff=true" >> "$GITHUB_OUTPUT"
          echo "$DIFF" > /tmp/pr-diff.txt

      - name: Get review checklist
        id: checklist
        run: |
          if [ -f ".claude/skills/code-review/SKILL.md" ]; then
            cat .claude/skills/code-review/SKILL.md > /tmp/checklist.txt
          else
            echo "No checklist found" > /tmp/checklist.txt
          fi

      - name: Run Gemini review
        if: steps.diff.outputs.has_diff == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          DIFF=$(cat /tmp/pr-diff.txt)
          CHECKLIST=$(cat /tmp/checklist.txt)

          # Build the prompt
          PROMPT=$(cat <<'PROMPT_END'
          You are a code reviewer for the Lunas project (Next.js + TypeScript + Tailwind + React Query).

          Review the PR diff below against this checklist:

          ---CHECKLIST---
          PLACEHOLDER_CHECKLIST
          ---END CHECKLIST---

          ---DIFF---
          PLACEHOLDER_DIFF
          ---END DIFF---

          ## Rules
          - Only comment on actual issues found in the diff
          - Use severity tiers: Blocker, Major, Minor, Nit
          - For each finding: **[Severity]** file:line — Description. Problem: ... Fix: ...
          - End with a summary: counts per severity + verdict
          - Verdict: REQUEST CHANGES if any Blocker or Major, APPROVE otherwise
          - If the diff is only documentation/config with no code issues, just APPROVE
          - Be concise. No filler.
          PROMPT_END

          # Replace placeholders
          PROMPT=$(echo "$PROMPT" | sed "s|PLACEHOLDER_CHECKLIST|$CHECKLIST|")
          PROMPT=$(echo "$PROMPT" | sed "s|PLACEHOLDER_DIFF|$DIFF|")

          # Call Gemini API
          RESPONSE=$(curl -sf -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "$(python3 -c "
          import json, sys
          prompt = open('/dev/stdin').read()
          print(json.dumps({
              'contents': [{'parts': [{'text': prompt}]}],
              'generationConfig': {'temperature': 0.1, 'maxOutputTokens': 8192}
          }))
          " <<< "Review this PR diff against the Lunas code review checklist.

          CHECKLIST:
          $(cat /tmp/checklist.txt)

          DIFF:
          $(cat /tmp/pr-diff.txt)

          RULES:
          - Only comment on actual issues in the diff
          - Severity tiers: Blocker, Major, Minor, Nit
          - Format: **[Severity]** file:line — Description. Problem: ... Fix: ...
          - End with summary: counts per severity + verdict
          - Verdict: REQUEST CHANGES if any Blocker or Major, APPROVE otherwise
          - If only docs/config with no issues, just APPROVE
          - Be concise")" 2>&1)

          # Extract the text response
          REVIEW=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              text = data['candidates'][0]['content']['parts'][0]['text']
              print(text)
          except Exception as e:
              print(f'Error parsing Gemini response: {e}')
              print('Raw response:')
              print(json.dumps(data, indent=2)[:2000] if 'data' in dir() else 'No response')
          ")

          echo "$REVIEW" > /tmp/review-output.txt

      - name: Post review comment
        if: steps.diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REVIEW=$(cat /tmp/review-output.txt)

          # Post as PR comment
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "## 🤖 Agent Code Review (Gemini)

          $REVIEW

          ---
          *Automated review via Gemini 2.0 Flash against [code-review checklist](.claude/skills/code-review/SKILL.md)*"
